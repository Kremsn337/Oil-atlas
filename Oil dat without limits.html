 <div class="stack" style="gap:28px">${src.tables.map(renderTable).join('')}</div></div>
 ${pager('limits')}${foot()}</div>`;
}

/* ----- checker ----- */
let chkSys='engine', chkVals={...CHECK.engine.example};
function evalField(f,v,fr){
 const num=x=>x===''||x==null||isNaN(+x)?null:+x;
 const val=num(v[f.k]); if(val==null) return {st:'na',w:'—',c:'—'};
 let st='ok',w='—',c='—';
 const fmt=x=>+(+x).toFixed(2);
 if(f.type==='max'){w='> '+f.w;c='> '+f.c; st=val>f.c?'crit':val>f.w?'warn':'ok';}
 else if(f.type==='min'){w='< '+f.w;c='< '+f.c; st=val<f.c?'crit':val<f.w?'warn':'ok';}
 else if(f.type==='add'){const b=num(fr[f.fresh]); if(b==null) return {st:'na',w:'fresh +'+f.w,c:'fresh +'+f.c}; w='> '+fmt(b+f.w); c='> '+fmt(b+f.c); st=val>b+f.c?'crit':val>b+f.w?'warn':'ok';}
 else if(f.type==='relmin'){const b=num(fr[f.fresh]); if(b==null) return {st:'na',w:'−40 %',c:'−60 %'}; const lw=b*(1-f.w), lc=b*(1-f.c); w='< '+fmt(lw); c='< '+fmt(lc); st=val<lc?'crit':val<lw?'warn':'ok';}
 else if(f.type==='pct'){const b=num(fr[f.fresh]); let wp=f.wp,cp=f.cp; if(f.wKey){const hv=(fr.type||'HV')==='HV'; wp=hv?.15:.10; cp=hv?.25:.15;}
   if(b==null) return {st:'na',w:'±'+wp*100+' %',c:'±'+cp*100+' %'};
   w=`${fmt(b*(1-wp))}–${fmt(b*(1+wp))}`; c=`< ${fmt(b*(1-cp))} · > ${fmt(b*(1+cp))}`; const d=Math.abs(val-b)/b; st=d>cp?'crit':d>wp?'warn':'ok';}
 else if(f.type==='sae'){const g=fr.sae||'40'; const L4={'40':[12.5,13.75,14.67,16.3],'30':[9.3,10.23,11.25,12.5]}[g]; w=`${L4[1]}–${L4[2]}`; c=`< ${L4[0]} · > ${L4[3]}`; st=(val<L4[0]||val>L4[3])?'crit':(val<L4[1]||val>L4[2])?'warn':'ok';}
 return {st,w,c};
}
function hintsFor(res,v){
 const s=k=>res[k]?res[k].st:'na', hi=k=>['warn','crit'].includes(s(k));
 const H=[];
 const push=id=>{const p=PATTERNS.find(x=>x.id===id); if(p&&!H.includes(p)) H.push(p);};
 if(hi('si')&&(hi('fe')||hi('cr')||hi('al'))) push('dust'); else if(hi('si')) push('dust-early');
 if(hi('fe')&&hi('cr')&&!hi('si')) push('rings');
 if(hi('pb')&&(hi('cu')||hi('sn'))) push('bearings');
 if(hi('pb')&&hi('tbn')) push('corrosion');
 if(hi('cu')&&!hi('pb')&&!hi('sn')) push('cooler');
 if(hi('na')||hi('gly')) push('coolant');
 if(hi('fuel')||hi('flash')||(res.kv100&&res.kv100.st!=='ok'&&res.kv100.st!=='na'&&+v.kv100<13.75)) push('fuel');
 if(hi('ox')||hi('nit')||(hi('tbn')&&!hi('pb'))) push('overload');
 if(hi('h2o')&&(hi('fe')||chkSys==='hyd')) push('rust');
 if(chkSys==='fd'&&hi('si')&&hi('h2o')) push('seal-fd');
 if(chkSys==='trans'&&hi('al')&&hi('cu')) push('converter');
 if(hi('ca')) push('mixing');
 return H;
}
function pChecker(){
 const S=CHECK[chkSys];
 const fr=chkVals;
 const res={}; S.fields.forEach(f=>res[f.k]=evalField(f,chkVals,fr));
 const cnt={ok:0,warn:0,crit:0}; Object.values(res).forEach(r=>{if(cnt[r.st]!=null)cnt[r.st]++;});
 const hints=hintsFor(res,chkVals);
 const input=(k,l,opts)=>`<div class="field"><label for="f-${k}">${tr(l)}</label>${opts?`<select id="f-${k}" data-k="${k}">${opts.map(o=>`<option ${String(chkVals[k])===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="f-${k}" data-k="${k}" type="number" step="any" inputmode="decimal" value="${chkVals[k]??''}">`}</div>`;
 const stCell=st=>`<span class="status-cell st-${st}"><i></i>${tr({ok:UI.stOk,warn:UI.stWarn,crit:UI.stCrit,na:UI.stNa}[st])}</span>`;
 return `<div class="page"><h1>${tr(UI.checker)}</h1><p class="lead">${tr(UI.checkerLead)}</p>
 <div class="section"><div class="tabs" role="tablist">${Object.entries(CHECK).map(([k,s])=>`<button role="tab" data-sys="${k}" aria-selected="${k===chkSys}">${tr(s.name)}</button>`).join('')}</div>
 <div class="card stack"><span class="eyebrow">${tr(UI.freshOil)}</span><div class="form-grid">${S.freshFields.map(f=>input(f.k,f.l,f.opts)).join('')}</div>
 <span class="eyebrow" style="margin-top:6px">${tr(UI.usedOil)}</span><div class="form-grid">${S.fields.map(f=>input(f.k,typeof f.l==='string'?f.l+', '+f.u:T(f.l.ru+', '+f.u,f.l.en+', '+f.u))).join('')}</div>
 <div class="row"><button class="btn" id="chkEx">${tr(UI.fillExample)}</button><button class="btn ghost" id="chkClr">${tr(UI.clear)}</button></div></div>
 <div id="chkOut" class="stack">${chkResult(S,res,cnt,hints,stCell)}</div>
 <p style="font-size:13px;color:var(--ink-3)">${tr(UI.checkerNote)}</p></div>
 ${pager('checker')}${foot()}</div>`;
}
function chkResult(S,res,cnt,hints,stCell){
 return `<div class="summary"><div><b style="color:var(--ok)">${cnt.ok}</b><span>${tr(UI.stOk)}</span></div><div><b style="color:var(--warn)">${cnt.warn}</b><span>Warning</span></div><div><b style="color:var(--crit)">${cnt.crit}</b><span>Action</span></div></div>
 <div class="tbl-wrap"><table><thead><tr><th>${tr(UI.param)}</th><th>${tr(UI.value)}</th><th class="w">Warning</th><th class="c">Action</th><th>${tr(UI.status)}</th></tr></thead><tbody>
 ${S.fields.map(f=>{const r=res[f.k];return `<tr><td><a href="#/${f.link}">${tr(f.l)}</a> <span style="color:var(--ink-3);font-size:12px">${f.u}</span></td><td class="n">${chkVals[f.k]??'—'}</td><td class="n">${r.w}</td><td class="n">${r.c}</td><td>${stCell(r.st)}</td></tr>`;}).join('')}
 </tbody></table></div>
 <h2>${tr(UI.hints)}</h2>
 ${hints.length?hints.map(p=>`<div class="callout ${p.sev==='ok'?'info':p.sev}"><b class="t">${tr(p.t)}</b><p>${tr(p.d)}</p><p><b>${tr(UI.action)}:</b> ${tr(p.a)} <a href="#/patterns">${tr(UI.patterns)} →</a></p></div>`).join(''):`<p style="color:var(--ink-2)">${tr(UI.noHints)}</p>`}`;
}
function bindChecker(){
 const root=$('#main');
 root.querySelectorAll('[data-sys]').forEach(b=>b.onclick=()=>{chkSys=b.dataset.sys; chkVals={...CHECK[chkSys].example}; render();});
 root.querySelectorAll('[data-k]').forEach(inp=>{inp.addEventListener('input',()=>{chkVals[inp.dataset.k]=inp.value; refreshChk();}); inp.addEventListener('change',()=>{chkVals[inp.dataset.k]=inp.value; refreshChk();});});
 $('#chkEx').onclick=()=>{chkVals={...CHECK[chkSys].example}; render();};
 $('#chkClr').onclick=()=>{const keep={}; CHECK[chkSys].freshFields.forEach(f=>{if(f.opts) keep[f.k]=f.opts[0];}); chkVals=keep; render();};
}
function refreshChk(){
 const S=CHECK[chkSys]; const res={}; S.fields.forEach(f=>res[f.k]=evalField(f,chkVals,chkVals));
 const cnt={ok:0,warn:0,crit:0}; Object.values(res).forEach(r=>{if(cnt[r.st]!=null)cnt[r.st]++;});
 const stCell=st=>`<span class="status-cell st-${st}"><i></i>${tr({ok:UI.stOk,warn:UI.stWarn,crit:UI.stCrit,na:UI.stNa}[st])}</span>`;
 $('#chkOut').innerHTML=chkResult(S,res,cnt,hintsFor(res,chkVals),stCell);
}

function pCases(){
 return `<div class="page"><h1>${tr(UI.cases)}</h1><p class="lead">${tr(UI.casesLead)}</p>
 <div class="section"><div class="tiles">${CASES.map(c=>`<a class="tile" href="#/case/${c.id}"><div>${sev(c.sev)}</div><h3>${tr(c.t)}</h3><p>${tr(c.eq)}</p></a>`).join('')}</div></div>
 ${pager('cases')}${foot()}</div>`;
}
function pCase(id){
 const c=CASES.find(x=>x.id===id); if(!c) return p404();
 const i=CASES.indexOf(c),p=CASES[i-1],n=CASES[i+1];
 return `<div class="page"><div class="crumbs"><a href="#/cases">${tr(UI.cases)}</a><span>/</span><span>${tr(c.t)}</span></div>
 <h1>${tr(c.t)}</h1><div style="margin-top:10px">${sev(c.sev)}</div>
 <div class="section"><div class="kv"><div>${tr(UI.equipment)}</div><div>${tr(c.eq)}</div></div>
 <div class="tbl-wrap"><table><thead><tr><th>${tr(c.rowHead)}</th>${c.cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>
 ${c.rows.map(r=>`<tr>${r.map(v=>`<td class="n">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <p style="color:var(--ink-3);font-size:13px">${tr(UI.examplesNote)}</p></div>
 <div class="section"><details class="card"><summary style="cursor:pointer;font-weight:600">${tr(UI.showReasoning)}</summary>
 <div class="steps" style="margin-top:16px">${c.steps[LANG].map(s=>`<div class="step"><p>${s}</p></div>`).join('')}</div>
 <div class="callout ${c.sev==='ok'?'ok':c.sev}"><b class="t">${tr(UI.conclusion)}</b><p>${tr(c.concl)}</p></div></details></div>
 <nav class="pager">${p?`<a href="#/case/${p.id}"><small>← ${tr(UI.prev)}</small>${tr(p.t)}</a>`:'<span></span>'}${n?`<a class="nx" href="#/case/${n.id}"><small>${tr(UI.next)} →</small>${tr(n.t)}</a>`:''}</nav>${foot()}</div>`;
}
function pGlossary(){
 const rows=[...GLOSSARY].sort((a,b)=>(LANG==='en'?a[1]:a[0]).localeCompare(LANG==='en'?b[1]:b[0],LANG));
 return `<div class="page"><h1>${tr(UI.glossary)}</h1><p class="lead">${tr(UI.glossaryLead)}</p>
 <div class="section"><div class="gloss">${rows.map(g=>`<div>${LANG==='en'?g[1]:g[0]}${LANG==='ru'&&g[0]!==g[1]?`<small>${g[1]}</small>`:''}</div><div>${LANG==='en'?g[3]:g[2]}</div>`).join('')}</div></div>
 ${pager('glossary')}${foot()}</div>`;
}
const pSoon=t=>`<div class="page"><h1>${tr(t)}</h1><div class="section"><div class="callout info"><b class="t">${tr(T('Раздел в доработке','Section in progress'))}</b><p>${tr(T('Таблицы лимитов и калькулятор проверки пробы временно скрыты: цифры уточняются. Появятся здесь после согласования.','Limit tables and the sample checker are temporarily hidden while the figures are being finalised. They will appear here once agreed.'))}</p><p><a href="#/">${tr(UI.home)} →</a></p></div></div>${foot()}</div>`;
const p404=()=>`<div class="page"><h1>404</h1><p class="lead"><a href="#/">${tr(UI.home)}</a></p></div>`;

/* ----- search ----- */
function searchIndex(){
 const idx=[];
 ELEMENTS.forEach(e=>idx.push({k:e.sym,t:tr(e.name),h:'#/el/'+e.id,s:[e.sym,e.name.ru,e.name.en,e.sum.ru,e.sum.en].join(' ')}));
 PARAMS.forEach(p=>idx.push({k:p.sym,t:tr(p.name),h:'#/param/'+p.id,s:[p.sym,p.name.ru,p.name.en,p.std,p.sum.ru,p.sum.en].join(' ')}));
 PATTERNS.forEach(p=>idx.push({k:tr(UI.patterns).slice(0,10),t:tr(p.t),h:'#/patterns',s:[p.t.ru,p.t.en,p.d.ru,p.d.en].join(' ')}));
 CASES.forEach(c=>idx.push({k:tr(UI.cases),t:tr(c.t),h:'#/case/'+c.id,s:[c.t.ru,c.t.en,c.eq.ru,c.eq.en].join(' ')}));
 GLOSSARY.forEach(g=>idx.push({k:tr(UI.glossary).slice(0,10),t:LANG==='en'?g[1]:g[0],h:'#/glossary',s:g.join(' ')}));
 NAV.flatMap(g=>g.items).forEach(([r,l])=>idx.push({k:'→',t:tr(l),h:'#/'+r,s:l.ru+' '+l.en}));
 return idx;
}
let IDX=[], qSel=0;
function doSearch(q){
 const box=$('#qres'); q=q.trim().toLowerCase();
 if(!q){box.hidden=true;return;}
 const exact=IDX.filter(i=>i.k.toLowerCase()===q);
 const titled=IDX.filter(i=>!exact.includes(i)&&i.t.toLowerCase().includes(q));
 const rest=IDX.filter(i=>!exact.includes(i)&&!titled.includes(i)&&i.s.toLowerCase().includes(q));
 const r=[...exact,...titled,...rest].slice(0,12); qSel=0;
 box.innerHTML=r.length?r.map((i,n)=>`<a href="${i.h}" class="${n===0?'on':''}"><span class="k">${esc(i.k)}</span><span>${esc(i.t)}</span></a>`).join(''):`<div style="padding:10px;color:var(--ink-3)">${tr(UI.nothing)}</div>`;
 box.hidden=false;
}

/* ----- router ----- */
function render(){
 const route=(location.hash.replace(/^#\/?/,'')||'');
 const [a,b]=route.split('/');
 let html;
 switch(a){
  case '': html=pHome(); break;
  case 'basics': html=pText('basics','basics'); break;
  case 'sampling': html=pText('sampling','sampling'); break;
  case 'methods': html=pMethods(); break;
  case 'elements': html=pElements(); break;
  case 'el': html=pElement(b); break;
  case 'params': html=pParams(); break;
  case 'param': html=pParam(b); break;
  case 'patterns': html=pPatterns(); break;
  case 'trends': html=pTrends(); break;
  case 'limits': html=SHOW_LIMITS?pLimits():pSoon(UI.limits); break;
  case 'checker': html=SHOW_LIMITS?pChecker():pSoon(UI.checker); break;
  case 'cases': html=pCases(); break;
  case 'case': html=pCase(b); break;
  case 'glossary': html=pGlossary(); break;
  default: html=p404();
 }
 const main=$('#main'); main.innerHTML=html;
 renderNav(route);
 if(a==='elements') main.querySelectorAll('[data-f]').forEach(btn=>btn.onclick=()=>{elFilter=btn.dataset.f; render();});
 if(a==='limits'&&SHOW_LIMITS) main.querySelectorAll('[data-src]').forEach(btn=>btn.onclick=()=>{limSrc=btn.dataset.src; render();});
 if(a==='trends') bindCharts(main);
 if(a==='checker'&&SHOW_LIMITS) bindChecker();
 $('#side').classList.remove('open');
}
function applyLang(){
 document.documentElement.lang=LANG;
 document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=tr(UI[n.dataset.i18n]));
 $('#q').placeholder=tr(UI.search);
 $('#lang-ru').setAttribute('aria-pressed',LANG==='ru'); $('#lang-en').setAttribute('aria-pressed',LANG==='en');
 IDX=searchIndex();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang; try{localStorage.setItem('uoa-lang',LANG);}catch(e){} applyLang(); render();});
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#q').addEventListener('input',e=>doSearch(e.target.value));
$('#q').addEventListener('keydown',e=>{
 const links=[...$('#qres').querySelectorAll('a')]; if(!links.length)return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); links[qSel].classList.remove('on'); qSel=(qSel+(e.key==='ArrowDown'?1:-1)+links.length)%links.length; links[qSel].classList.add('on');}
 if(e.key==='Enter'){location.hash=links[qSel].getAttribute('href'); $('#qres').hidden=true; e.target.value=''; e.target.blur();}
 if(e.key==='Escape'){$('#qres').hidden=true;}
});
$('#qres').addEventListener('click',()=>{$('#qres').hidden=true;$('#q').value='';});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#qres').hidden=true; if(!e.target.closest('#side')&&!e.target.closest('#menuBtn'))$('#side').classList.remove('open');});
window.addEventListener('hashchange',()=>{render(); window.scrollTo(0,0);});
applyLang(); render();

</script>
