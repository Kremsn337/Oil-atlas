<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Атлас анализа масел</title>
<meta name="description" content="Справочник по интерпретации анализа отработанных масел: элементы износа, присадки, загрязнения, физико-химические параметры, тренды и лимиты. RU/EN.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#E9EEEB; --surface-3:#DDE4E0;
  --ink:#131D19; --ink-2:#45544D; --ink-3:#6F7D77; --line:#D3DCD7; --line-2:#BFCAC4;
  --accent:#4A3AA7; --accent-soft:#ECE9FA; --accent-ink:#FFFFFF;
  --wear:#2A78D6; --wear-soft:#E3EEFB; --wear-ink:#1B5AA6;
  --add:#1BAF7A; --add-soft:#DFF4EC; --add-ink:#0E7A53;
  --cont:#EB6834; --cont-soft:#FCE9E1; --cont-ink:#B2461B;
  --phys:#6B7A73; --phys-soft:#E6ECE9; --phys-ink:#44524B;
  --ok:#2E7D32; --ok-soft:#E3F1E4;
  --warn:#B7791F; --warn-soft:#FBF0DC;
  --crit:#C62828; --crit-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(19,29,25,.06),0 4px 16px rgba(19,29,25,.05);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1311; --surface:#151C19; --surface-2:#1C2521; --surface-3:#25302B;
    --ink:#E3EAE6; --ink-2:#A8B6AF; --ink-3:#7D8B85; --line:#28332E; --line-2:#36433D;
    --accent:#9085E9; --accent-soft:#252146; --accent-ink:#0E1311;
    --wear:#3987E5; --wear-soft:#15253A; --wear-ink:#86B5F0;
    --add:#199E70; --add-soft:#12291F; --add-ink:#6FD3AC;
    --cont:#D95926; --cont-soft:#33190F; --cont-ink:#F29B75;
    --phys:#8A9892; --phys-soft:#1F2824; --phys-ink:#B9C6C0;
    --ok:#5DBB63; --ok-soft:#15281A;
    --warn:#E0A84A; --warn-soft:#2E2412;
    --crit:#EF6B6B; --crit-soft:#361718;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1311; --surface:#151C19; --surface-2:#1C2521; --surface-3:#25302B;
  --ink:#E3EAE6; --ink-2:#A8B6AF; --ink-3:#7D8B85; --line:#28332E; --line-2:#36433D;
  --accent:#9085E9; --accent-soft:#252146; --accent-ink:#0E1311;
  --wear:#3987E5; --wear-soft:#15253A; --wear-ink:#86B5F0;
  --add:#199E70; --add-soft:#12291F; --add-ink:#6FD3AC;
  --cont:#D95926; --cont-soft:#33190F; --cont-ink:#F29B75;
  --phys:#8A9892; --phys-soft:#1F2824; --phys-ink:#B9C6C0;
  --ok:#5DBB63; --ok-soft:#15281A;
  --warn:#E0A84A; --warn-soft:#2E2412;
  --crit:#EF6B6B; --crit-soft:#361718;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.01em}
h2{font-size:24px;margin-top:8px}
h3{font-size:18px;font-weight:500}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.92em}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;max-width:1320px;margin:0 auto;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:600 13px/1 var(--f-mono)}
.brand-name{font:650 17px/1.1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{display:block;font:400 11px/1.2 var(--f-body);color:var(--ink-3)}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 12px 0 34px;font:14px var(--f-body)}
.search svg{position:absolute;left:10px;top:11px;width:16px;height:16px;stroke:var(--ink-3)}
.search-res{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;padding:6px}
.search-res a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
.search-res a:hover,.search-res a.on{background:var(--surface-2)}
.search-res .k{font:600 11px var(--f-mono);color:var(--ink-3);min-width:74px}
.lang{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--surface);color:var(--ink-2);font:600 12px var(--f-mono);padding:0 10px;height:36px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.menu-btn{display:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;height:38px;width:40px;cursor:pointer;flex:none}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;max-width:1320px;margin:0 auto;padding-inline:16px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);align-self:start;max-height:calc(100vh - 70px);overflow:auto;padding-block:20px}
.side .grp{margin-bottom:18px}
.side .grp .eyebrow{display:block;padding:0 10px 6px}
.side a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:14px}
.side a:hover{background:var(--surface-2);color:var(--ink)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .cnt{margin-left:auto;font:11px var(--f-mono);color:var(--ink-3)}
main{padding-block:24px 80px;min-width:0}
.page{max-width:920px}
.page.wide{max-width:none}
.lead{font-size:17px;color:var(--ink-2);max-width:68ch;margin-top:10px}
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:14px}
.section{margin-top:36px;display:flex;flex-direction:column;gap:14px}
.prose{max-width:70ch;display:flex;flex-direction:column;gap:10px}
.prose ul,.prose ol,ul.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.prose li::marker{color:var(--ink-3)}

/* ---------- tiles, chips, cards ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:999px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:block}
.chip.wear{background:var(--wear-soft);color:var(--wear-ink)} .chip.wear i{background:var(--wear)}
.chip.add{background:var(--add-soft);color:var(--add-ink)} .chip.add i{background:var(--add)}
.chip.cont{background:var(--cont-soft);color:var(--cont-ink)} .chip.cont i{background:var(--cont)}
.chip.phys{background:var(--phys-soft);color:var(--phys-ink)} .chip.phys i{background:var(--phys)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.ptable{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.el{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:96px;padding:9px 10px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:transform .12s ease,border-color .12s ease}
.el:hover{transform:translateY(-2px);border-color:var(--line-2)}
.el .sym{font:600 26px/1 var(--f-mono);letter-spacing:-.02em}
.el .nm{font-size:12px;color:var(--ink-2);line-height:1.25}
.el .dots{position:absolute;top:10px;right:9px;display:flex;gap:3px}
.el .dots i{width:7px;height:7px;border-radius:50%}
.el.wear{box-shadow:inset 0 3px 0 var(--wear)} .el.add{box-shadow:inset 0 3px 0 var(--add)} .el.cont{box-shadow:inset 0 3px 0 var(--cont)} .el.phys{box-shadow:inset 0 3px 0 var(--phys)}
.el.phys .sym{font-size:17px;line-height:1.15}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.tile:hover{border-color:var(--accent)}
.tile h3{font-size:17px}
.tile p{font-size:14px;color:var(--ink-2)}
.tile .eyebrow{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:0;border-top:1px solid var(--line)}
.kv>div{padding:10px 0;border-bottom:1px solid var(--line)}
.kv>div:nth-child(odd){color:var(--ink-3);font-size:13px;padding-right:12px}
.hero-el{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.big-sym{flex:none;width:112px;height:112px;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;background:var(--surface);border:1px solid var(--line)}
.big-sym b{font:600 46px/1 var(--f-mono)}
.big-sym small{font:11px var(--f-mono);color:var(--ink-3)}
.big-sym.wear{box-shadow:inset 0 4px 0 var(--wear)} .big-sym.add{box-shadow:inset 0 4px 0 var(--add)} .big-sym.cont{box-shadow:inset 0 4px 0 var(--cont)} .big-sym.phys{box-shadow:inset 0 4px 0 var(--phys)}
.big-sym.phys b{font-size:24px}

.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sys{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.sys h4{margin:0 0 6px;font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.sys h4 svg{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:1.6}
.sys ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:2px}

.callout{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;border:1px solid var(--line)}
.callout b.t{font:600 12px var(--f-body);letter-spacing:.07em;text-transform:uppercase}
.callout.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)} .callout.warn b.t{color:var(--warn)}
.callout.crit{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,transparent)} .callout.crit b.t{color:var(--crit)}
.callout.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)} .callout.info b.t{color:var(--accent)}
.callout.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)} .callout.ok b.t{color:var(--ok)}
.callout ul{margin:0;padding-left:18px}

.combo{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.combo:first-of-type{border-top:1px solid var(--line)}
.combo .syms{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.combo .syms a,.combo .syms span{font:600 13px/1 var(--f-mono);padding:6px 7px;border-radius:6px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.combo .syms .up{color:var(--crit)} .combo .syms .dn{color:var(--wear-ink)}
.combo h3{font-size:16px;margin-bottom:4px}
.combo .body{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.combo .meta{font-size:13px;color:var(--ink-2)}
.sev{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:4px}
.sev.ok{background:var(--ok-soft);color:var(--ok)} .sev.warn{background:var(--warn-soft);color:var(--warn)} .sev.crit{background:var(--crit-soft);color:var(--crit)}
.sev svg,.chart .sev svg{width:12px;height:12px;flex:none;display:inline-block}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px/1.3 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
td.w{color:var(--warn);font-weight:600} td.c{color:var(--crit);font-weight:600}
th.w{color:var(--warn)} th.c{color:var(--crit)}
tbody tr.grp td{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.05em}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;font:500 14px var(--f-body);color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.filter button i{width:8px;height:8px;border-radius:50%}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- charts ---------- */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 8px;position:relative}
.chart h4{margin:0;font:600 14px var(--f-body)}
.chart .sub{font-size:12.5px;color:var(--ink-3)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{stroke:var(--line-2);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--ink-3);font:11px var(--f-mono)}
.chart .lim-w{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.chart .lim-c{stroke:var(--crit);stroke-width:1.5;stroke-dasharray:5 4}
.chart text.lw{fill:var(--warn);font-weight:600} .chart text.lc{fill:var(--crit);font-weight:600}
.chart .ser{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{stroke:var(--surface);stroke-width:2}
.chart .chg{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.chart text.lbl{font-weight:600}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:12px/1.4 var(--f-mono);padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.chart .legend{margin-top:6px}
.s1{--c:var(--wear)} .s2{--c:var(--cont)} .s3{--c:var(--add)}
.chart .ser.s1,.chart .ser.s2,.chart .ser.s3{stroke:var(--c)}
.chart .dot.s1,.chart .dot.s2,.chart .dot.s3{fill:var(--c)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}

/* ---------- checker ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--ink-2)}
.field input,.field select{height:36px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);padding:0 10px;font:14px var(--f-mono);width:100%}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:9px 14px;font:600 14px var(--f-body);cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status-cell{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.status-cell i{width:9px;height:9px;border-radius:50%;display:block}
.st-ok{color:var(--ok)} .st-ok i{background:var(--ok)}
.st-warn{color:var(--warn)} .st-warn i{background:var(--warn)}
.st-crit{color:var(--crit)} .st-crit i{background:var(--crit)}
.st-na{color:var(--ink-3)} .st-na i{background:var(--line-2)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.summary b{display:block;font:600 28px/1 var(--f-mono)}
.summary span{font-size:12px;color:var(--ink-3)}

/* ---------- steps ---------- */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:12px}
.step{position:relative;padding:0 0 18px 26px}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:-13px;top:0;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);font:600 11px/20px var(--f-mono);text-align:center;color:var(--ink-2)}
.step h3{font-size:16px;margin-bottom:4px}
.step p,.step li{font-size:14.5px}

.gloss{display:grid;grid-template-columns:minmax(140px,230px) 1fr;border-top:1px solid var(--line)}
.gloss>div{padding:10px 0;border-bottom:1px solid var(--line)}
.gloss>div:nth-child(odd){font-weight:600;padding-right:14px}
.gloss small{display:block;font:11px var(--f-mono);color:var(--ink-3);font-weight:400}

.foot{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px;max-width:920px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1;min-width:200px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink)}
.pager a small{display:block;color:var(--ink-3);font-size:12px}
.pager a.nx{text-align:right}
.method-row{display:grid;grid-template-columns:minmax(160px,230px) 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.method-row:first-child{border-top:1px solid var(--line)}
.method-row .std{font:12px var(--f-mono);color:var(--ink-3);margin-top:4px}
.badge{font:600 10.5px var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}

@media (max-width: 900px){
  .wrap{grid-template-columns:1fr;gap:0}

  .side.open{transform:none}
  .menu-btn{display:grid;place-items:center}
  .brand-sub{display:none}
  .search{max-width:none}
  .kv,.combo,.method-row,.gloss{grid-template-columns:1fr}
  .kv>div:nth-child(odd),.gloss>div:nth-child(odd){border-bottom:0;padding-bottom:0}
  .combo{gap:8px}
}
@media (max-width: 560px){
  .brand-name{display:none}
  .summary{grid-template-columns:1fr}
  .side{inset:0 12% 0 0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{.top,.side,.pager{display:none}.wrap{display:block}}

<script>
/* ============ ELEMENTS ============ */
const T=(ru,en)=>({ru,en});
const L=(ru,en)=>({ru,en});

const SYSTEMS={
  engine:T('Двигатель','Engine'),
  trans:T('Трансмиссия / ГМП','Transmission'),
  fd:T('Мосты, бортовые, редукторы хода','Axles, final drives, travel'),
  hyd:T('Гидравлика','Hydraulics'),
  gear:T('Промышленные редукторы','Industrial gearboxes'),
  cont:T('Как загрязнение / другое','As contaminant / other'),
  add:T('Как присадка','As additive')
};
const CATS={
  wear:T('Износ','Wear'),
  add:T('Присадка','Additive'),
  cont:T('Загрязнение','Contaminant'),
  phys:T('Физ-хим','Phys-chem')
};

const ELEMENTS=[
/* ---------------- WEAR ---------------- */
{id:'fe',sym:'Fe',z:26,cats:['wear','cont'],name:T('Железо','Iron'),
 sum:T('Самый распространённый металл износа. Из стали и чугуна сделаны блоки, гильзы, валы, шестерни, подшипники качения, корпуса. Сам по себе Fe почти ничего не говорит о месте износа — смотрите, с какими элементами он растёт.',
       'The most common wear metal. Blocks, liners, shafts, gears, rolling bearings and housings are made of steel or cast iron. Fe on its own rarely pinpoints the worn part — look at which elements rise with it.'),
 src:{
  engine:L(['Гильзы / стенки цилиндров','Коленвал, распредвал, толкатели, коромысла','Шестерни ГРМ, масляный насос','Чугунные кольца, направляющие клапанов'],['Cylinder liners / walls','Crankshaft, camshaft, followers, rocker arms','Timing gears, oil pump','Cast-iron rings, valve guides']),
  trans:L(['Шестерни, шлицы, валы','Подшипники качения','Стальные диски фрикционов, тормоза в масле','Насос, золотники, корпуса'],['Gears, splines, shafts','Rolling bearings','Steel clutch plates, wet brakes','Pump, spools, housings']),
  fd:L(['Зубья шестерён (солнечная, сателлиты, коронная)','Подшипники, валы','Корпуса'],['Gear teeth (sun, planets, ring gear)','Bearings, shafts','Housings']),
  hyd:L(['Роторы, лопатки, плунжеры насосов','Штоки, корпуса и расточки','Шестерни и валы насосов, клапаны'],['Pump rotors, vanes, pistons','Rods, housings and bores','Pump gears and shafts, valves']),
  gear:L(['Шестерни, валы','Подшипники качения'],['Gears, shafts','Rolling bearings']),
  cont:L(['Ржавчина (вода, конденсат)','Рудная пыль на железорудных карьерах','Стружка после ремонта / обкатки'],['Rust (water, condensation)','Ore dust at iron-ore mines','Machining debris after repair / running-in'])
 },
 combos:[
  {s:['fe','cr','si','al'],t:T('Пыль попадает через впуск → износ колец, гильз, поршней (верх двигателя).','Dust entering through intake → ring, liner and piston wear (upper engine).')},
  {s:['fe','cr'],t:T('Параллельный рост → износ колец и/или гильз; проверить расход масла, картерные газы, компрессию.','Parallel rise → ring and/or liner wear; check oil consumption, blow-by, compression.')},
  {s:['fe','cr','ni'],t:T('Легированная сталь → подшипники качения, шестерни, валы.','Alloy steel → rolling bearings, gears, shafts.')},
  {s:['fe','water'],t:T('Fe растёт вместе с водой → коррозия / ржавчина, а не механический износ.','Fe rising with water → corrosion / rust rather than mechanical wear.')}
 ],
 causes:L(['Абразив (Si, Al), плохая фильтрация','Низкая или высокая вязкость, разбавление топливом','Перегрев, окисление масла','Перегрузки, ударные нагрузки','Усталостное выкрашивание подшипников и зубьев','Вода и коррозия'],
          ['Abrasives (Si, Al), poor filtration','Viscosity too low or too high, fuel dilution','Overheating, oil oxidation','Overloads, shock loads','Fatigue spalling of bearings and gear teeth','Water and corrosion']),
 pitfalls:L(['ICP почти не видит частицы крупнее ~5–10 мкм. Тяжёлый износ с крупными осколками может дать «нормальный» Fe → нужен PQ-индекс или феррография.','В бортовых редукторах и редукторах хода Fe в сотни ppm — норма (у экскаваторов лимит Caution 580–700 ppm). Сравнивайте только с лимитом своей системы.','После замены масла остаётся 10–15 % старого — Fe не будет нулём.'],
            ['ICP barely sees particles larger than ~5–10 µm. Severe wear with large debris can show "normal" Fe → use PQ index or ferrography.','Final drives and travel reducers normally carry hundreds of ppm Fe (excavator Caution limit is 580–700 ppm). Compare only with your system\'s limit.','An oil change leaves 10–15 % of old oil — Fe will not drop to zero.']),
 actions:L(['Посмотреть Si, Al, Cr, Ni, воду и вязкость в той же пробе','Заказать PQ-индекс / аналитическую феррографию при резком росте','Осмотреть магнитные пробки и фильтр','Повторная проба через 50–100 ч'],
           ['Check Si, Al, Cr, Ni, water and viscosity in the same sample','Order PQ index / analytical ferrography on a sharp rise','Inspect magnetic plugs and filter','Resample after 50–100 h']),
 fresh:T('0–2 ppm','0–2 ppm')},

{id:'cr',sym:'Cr',z:24,cats:['wear','cont'],name:T('Хром','Chromium'),
 sum:T('Хромом покрывают поршневые кольца, реже гильзы и штоки. В стали — легирующий элемент подшипников и шестерён. Рост Cr в двигателе почти всегда говорит о кольцах.',
       'Chromium plates piston rings, sometimes liners and rods. In steels it alloys bearings and gears. Rising Cr in an engine almost always points to the rings.'),
 src:{
  engine:L(['Хромированные компрессионные кольца','Хромированные гильзы (редко; тогда кольца чугунные)','Штоки клапанов, выпускные клапаны'],['Chrome-plated compression rings','Chromed liners (rare; rings are then cast iron)','Valve stems, exhaust valves']),
  trans:L(['Легированная сталь шестерён, подшипников, валов','Кольца синхронизаторов (КПП)'],['Alloy steel of gears, bearings, shafts','Synchroniser rings (manual gearboxes)']),
  fd:L(['Шестерни, подшипники, валы','Уплотнения'],['Gears, bearings, shafts','Seals']),
  hyd:L(['Хромированные штоки цилиндров','Золотники и клапаны'],['Chrome-plated cylinder rods','Spools and valves']),
  gear:L(['Шестерни, валы, подшипники (легирование)'],['Gears, shafts, bearings (alloying)']),
  cont:L(['Хромат натрия в старых присадках к ОЖ (вместе с Na)','Пыль на хромитовых рудниках'],['Sodium chromate in older coolant conditioners (with Na)','Dust at chromite mines'])
 },
 combos:[
  {s:['cr','fe'],t:T('Кольца + гильзы. Смотреть расход масла, картерные газы, белый дым.','Rings + liners. Check oil consumption, blow-by, white smoke.')},
  {s:['cr','si','al'],t:T('Абразивный износ колец пылью.','Abrasive ring wear from dust.')},
  {s:['cr','na'],t:T('Утечка ОЖ с хроматной присадкой.','Coolant leak with chromate conditioner.')}
 ],
 causes:L(['Пыль через впуск','Залегание / поломка колец','Разбавление топливом (смывание плёнки со стенок)','Перегрев','Износ хромированных штоков гидроцилиндров'],
          ['Dust through intake','Stuck / broken rings','Fuel dilution (washing oil film off walls)','Overheating','Wear of chrome hydraulic rods']),
 pitfalls:L(['Обычные значения — единицы ppm, поэтому даже рост с 2 до 6 ppm существенен (EM: Warning 6, Action 10).'],
            ['Normal readings are single-digit ppm, so even 2 → 6 ppm matters (EM: Warning 6, Action 10).']),
 actions:L(['Проверить воздушный фильтр и впускной тракт','Замер компрессии и картерных газов','Сравнить с трендом Fe и Si'],
           ['Inspect air filter and intake tract','Measure compression and blow-by','Compare with Fe and Si trend']),
 fresh:T('0–1 ppm','0–1 ppm')},

{id:'al',sym:'Al',z:13,cats:['wear','cont'],name:T('Алюминий','Aluminium'),
 sum:T('Поршни, корпуса турбин и насосов, гидротрансформаторы, подшипники скольжения на алюминиевой основе. Но Al также входит в состав пыли — поэтому всегда смотрите на Si рядом.',
       'Pistons, turbo and pump housings, torque converters, aluminium-based plain bearings. Al is also a component of dust — always look at Si next to it.'),
 src:{
  engine:L(['Поршни (задир, прогар)','Вкладыши Al–Sn','Корпус и колесо компрессора турбины','Корпус масляного насоса, блоки, упорные шайбы'],['Pistons (scuffing, burning)','Al–Sn bearing shells','Turbo compressor housing and wheel','Oil pump housing, blocks, thrust washers']),
  trans:L(['Гидротрансформатор (насосное, турбинное колесо, реактор)','Корпус насоса, гидроблок'],['Torque converter (impeller, turbine, stator)','Pump housing, valve body']),
  fd:L(['Втулки и упорные шайбы (в некоторых)','Приводная шестерня насоса'],['Bushings and thrust washers (some)','Pump drive gear']),
  hyd:L(['Корпуса насосов (некоторые)'],['Pump housings (some)']),
  gear:L(['Втулки, упорные шайбы, насосы (некоторые)'],['Bushings, thrust washers, pumps (some)']),
  cont:L(['Пыль: оксиды Al и Si (глина, камень)','Консистентная смазка на Al-комплексе','Бокситы на рудниках'],['Dust: Al and Si oxides (clay, stone)','Aluminium-complex grease','Bauxite at mines'])
 },
 combos:[
  {s:['al','si'],t:T('Растут вместе в соотношении примерно Al:Si = 1:2…1:5 → пыль. Соотношение зависит от местной геологии — выясните его на своей площадке.','Rising together at roughly Al:Si = 1:2…1:5 → dust. The ratio depends on local geology — establish it for your site.')},
  {s:['al','fe','cr'],t:T('Без роста Si → поршень / кольцо / гильза (задир, перегрев). С Si → абразив.','Without Si → piston / ring / liner (scuffing, overheating). With Si → abrasion.')},
  {s:['al','pb','sn'],t:T('Вкладыши на алюминиевой основе.','Aluminium-based bearings.')}
 ],
 causes:L(['Пыль','Перегрев поршня, нарушение охлаждения','Задевание колеса турбины о корпус','Кавитация / износ гидротрансформатора'],
          ['Dust','Piston overheating, cooling faults','Turbo wheel rubbing the housing','Torque converter cavitation / wear']),
 pitfalls:L(['Al от поршней может увести мысль в сторону вкладышей и наоборот — у некоторых вкладышей есть Al-слой. Сверяйте с Pb, Sn, Cu.','Если Al растёт только вместе с Si и соотношение стабильно — первым делом ищите негерметичность впуска, а не износ.'],
            ['Al from pistons can mislead you towards bearings and vice versa — some bearings have an Al layer. Cross-check with Pb, Sn, Cu.','If Al rises only with Si at a stable ratio — look for an intake leak before looking for wear.']),
 actions:L(['Посчитать соотношение Al:Si','Осмотреть впуск, турбину (люфт вала)','Проверить температуру двигателя / ГМП'],
           ['Calculate the Al:Si ratio','Inspect intake and turbo (shaft play)','Check engine / transmission temperature']),
 fresh:T('0–2 ppm','0–2 ppm')},

{id:'cu',sym:'Cu',z:29,cats:['wear','cont','add'],name:T('Медь','Copper'),
 sum:T('«Жёлтые металлы»: бронза (Cu+Sn) и латунь (Cu+Zn). Втулки, упорные шайбы, вкладыши, спечённые диски фрикционов, трубки маслоохладителей. Высокий Cu часто бывает безопасным — если это выщелачивание из охладителя.',
       '"Yellow metals": bronze (Cu+Sn) and brass (Cu+Zn). Bushings, thrust washers, bearings, sintered clutch discs, oil cooler tubes. High Cu is often harmless — when it is leaching from a cooler.'),
 src:{
  engine:L(['Медно-свинцовый слой вкладышей','Втулки поршневого пальца, распредвала, коромысел','Упорные шайбы, подшипники турбины','Трубки маслоохладителя (выщелачивание)','Втулки ТНВД и регулятора'],['Copper-lead layer of bearing shells','Piston pin, camshaft and rocker bushings','Thrust washers, turbo bearings','Oil cooler tubes (leaching)','Fuel pump and governor bushings']),
  trans:L(['Спечённые бронзовые диски фрикционов (ГМП, муфты поворота)','Втулки, упорные шайбы','Втулки насоса, маслоохладитель'],['Sintered bronze clutch discs (powershift, steering clutches)','Bushings, thrust washers','Pump bushings, oil cooler']),
  fd:L(['Упорные шайбы и втулки дифференциалов и бортовых'],['Thrust washers and bushings in differentials and final drives']),
  hyd:L(['Башмаки поршней, чашки наклонной шайбы','Распределительный диск, блок цилиндров (бронза)','Втулки, трубки охладителя'],['Piston slippers, swash plate cups','Valve plate, cylinder barrel (bronze)','Bushings, cooler tubes']),
  gear:L(['Бронзовые червячные колёса','Латунные сепараторы подшипников, втулки'],['Bronze worm wheels','Brass bearing cages, bushings']),
  cont:L(['Выщелачивание из охладителей и радиаторов','Медные противозадирные пасты при сборке','Агрессивные серосодержащие EP/AW-присадки'],['Leaching from coolers and radiators','Copper anti-seize compounds on assembly','Aggressive sulphur EP/AW additives'])
 },
 combos:[
  {s:['cu','pb','sn'],t:T('Вкладыши подшипников скольжения (низ двигателя).','Plain bearings (lower engine).')},
  {s:['cu'],t:T('Cu резко высокий, Pb и Sn нормальные, со временем падает → выщелачивание из нового охладителя. Обычно не проблема.','Cu sharply high, Pb and Sn normal, decreasing over time → leaching from a new cooler. Usually not a problem.')},
  {s:['cu','zn'],t:T('Латунь: сепараторы, втулки.','Brass: cages, bushings.')},
  {s:['cu','na','k'],t:T('Утечка ОЖ: вода испарилась, а медь из водяной стороны охладителя осталась.','Coolant leak: water evaporated, copper from the cooler water side remained.')}
 ],
 causes:L(['Износ фрикционов (проскальзывание, перегрев ГМП)','Износ втулок и шайб (недостаток смазки, перегрузка)','Вода в масле, реагирующая с медью','Износ бронзовых деталей гидронасоса'],
          ['Clutch wear (slipping, transmission overheating)','Bushing and washer wear (lubrication shortage, overload)','Water in oil reacting with copper','Wear of bronze hydraulic pump parts']),
 pitfalls:L(['Сотни ppm Cu после установки нового охладителя или смены масла на продукт с активной серой — типичная ложная тревога. Решает тренд: при выщелачивании Cu падает от пробы к пробе.','В ГМП Cu от фрикционов естественно выше, чем в двигателе (EM: Warning 100 ppm для трансмиссий против 20 ppm для двигателей).'],
            ['Hundreds of ppm Cu after a new cooler or a switch to an oil with active sulphur is a classic false alarm. Trend decides: leaching Cu falls from sample to sample.','Transmission Cu from clutches is naturally higher than engine Cu (EM: Warning 100 ppm for transmissions vs 20 ppm for engines).']),
 actions:L(['Проверить Pb и Sn — растут ли вместе','Уточнить, не меняли ли охладитель / масло','Проверить воду, Na, K','Для ГМП — давление и температура, проскальзывание'],
           ['Check whether Pb and Sn rise too','Ask whether the cooler / oil was changed','Check water, Na, K','For transmissions — pressure, temperature, slipping']),
 fresh:T('0–1 ppm (редко выше в спецмаслах)','0–1 ppm (rarely higher in special oils)')},

{id:'pb',sym:'Pb',z:82,cats:['wear','cont'],name:T('Свинец','Lead'),
 sum:T('Приработочный слой вкладышей коренных и шатунных подшипников, баббит. Рост Pb — сигнал о низе двигателя: недостаток смазки, перегрузка, пыль или кислотная коррозия.',
       'Overlay of main and rod bearings, babbitt. Rising Pb signals the lower engine: lubrication shortage, overload, dust or acid corrosion.'),
 src:{
  engine:L(['Приработочный слой (overlay) вкладышей','Медно-свинцовые вкладыши, баббит','Упорные полукольца, втулки'],['Bearing overlay','Copper-lead bearings, babbitt','Thrust washers, bushings']),
  trans:L(['Подшипники скольжения, втулки','Фрикционы старых конструкций'],['Plain bearings, bushings','Older clutch designs']),
  fd:L(['Подшипники, втулки'],['Bearings, bushings']),
  hyd:L(['Упорная пластина насоса, втулки'],['Pump thrust plate, bushings']),
  gear:L(['Подшипники, втулки'],['Bearings, bushings']),
  cont:L(['Припой в системе охлаждения','Старые свинцовые EP-смазки и редукторные масла','Этилированный бензин (сейчас редкость)','Антикоррозионные краски в старых корпусах'],['Solder in the cooling system','Old lead-based EP greases and gear oils','Leaded petrol (rare today)','Anti-corrosion paint in older housings'])
 },
 combos:[
  {s:['pb','sn','cu'],t:T('Износ вкладышей. Обычно Pb растёт первым, затем подтягивается Cu.','Bearing wear. Usually Pb rises first and Cu follows.')},
  {s:['pb','tbn'],t:T('Pb растёт один + низкий TBN / высокий TAN / окисление → кислоты растворяют свинцовый слой (коррозионный износ).','Pb alone + low TBN / high TAN / oxidation → acids dissolve the lead overlay (corrosive wear).')},
  {s:['pb','fuel'],t:T('Pb + падение вязкости + топливо → тонкая плёнка, вкладыши на грани.','Pb + viscosity drop + fuel → thin film, bearings at risk.')}
 ],
 causes:L(['Недостаточное давление масла, масляное голодание','Низкая вязкость (топливо, перегрев)','Кислотная коррозия (исчерпан TBN)','Перегрузка, пыль'],
          ['Low oil pressure, oil starvation','Low viscosity (fuel, overheating)','Acid corrosion (depleted TBN)','Overload, dust']),
 pitfalls:L(['Pb в одиночку малоинформативен — смотрите вместе с Cu и Sn и с TBN.','После капремонта свинец может расти от приработки новых вкладышей.'],
            ['Pb alone says little — read it with Cu, Sn and TBN.','After an overhaul Pb can rise as new bearings run in.']),
 actions:L(['Проверить давление масла и вязкость','Проверить TBN, TAN, окисление, сульфатацию','Осмотреть фильтр на блестящие частицы'],
           ['Check oil pressure and viscosity','Check TBN, TAN, oxidation, sulphation','Inspect filter for shiny particles']),
 fresh:T('0 ppm','0 ppm')},

{id:'sn',sym:'Sn',z:50,cats:['wear','cont'],name:T('Олово','Tin'),
 sum:T('Слой вкладышей (сплав с Pb), алюминиево-оловянные вкладыши, лужение поршней, бронза. Нормальные значения — единицы ppm, поэтому любые изменения заметны.',
       'Bearing overlay (alloyed with Pb), aluminium-tin bearings, tin-plated pistons, bronze. Normal readings are single-digit ppm, so any change is noticeable.'),

const PAGES={};

PAGES.basics={
 title:T('Основы анализа масла','Oil analysis basics'),
 lead:T('Анализ работающего масла — это небольшая проба из узла и набор лабораторных тестов. По результатам отвечаем на три вопроса: в каком состоянии машина, в каком состоянии масло и насколько оно загрязнено.',
        'Used oil analysis is a small sample from a component and a battery of lab tests. The results answer three questions: how healthy is the machine, how healthy is the oil, and how contaminated is it.'),
 html:{
ru:`
<div class="tiles">
 <div class="tile"><span class="eyebrow">1 · Машина</span><h3>Износ</h3><p>Металлы износа (Fe, Cu, Pb, Cr, Al, Sn…), PQ-индекс, феррография. Износ растёт задолго до шума, вибрации и нагрева.</p></div>
 <div class="tile"><span class="eyebrow">2 · Масло</span><h3>Состояние масла</h3><p>Вязкость, TBN, TAN, окисление, нитрация, сульфатация, элементы присадок. Можно ли масло работать дальше.</p></div>
 <div class="tile"><span class="eyebrow">3 · Загрязнение</span><h3>Что попало внутрь</h3><p>Пыль (Si, Al), вода, гликоль (Na, K, B), топливо, сажа, частицы по ISO 4406.</p></div>
</div>
<div class="section"><h2>Зачем это нужно</h2>
<div class="prose"><ul>
<li><b>Состояние масла</b> — пригодно ли масло к дальнейшей работе.</li>
<li><b>Оптимизация интервала замены.</b> Эффективный интервал может быть определён только анализом масла. Он зависит от конструкции двигателя, качества масла, расхода масла, условий эксплуатации и топлива.</li>
<li><b>Состояние оборудования</b> — ранние признаки неисправностей, которые повлияют на надёжность.</li>
<li><b>Предиктивное обслуживание.</b> Металлы и частицы износа начинают расти задолго до вибрации, температуры и шума — анализ масла остаётся лучшим инструментом раннего обнаружения износа.</li>
</ul></div></div>
<div class="section"><h2>Рутинный и расширенный анализ</h2>
<div class="tbl-wrap"><table>
<thead><tr><th></th><th>Рутинный (routine)</th><th>Расширенный (non-routine)</th></tr></thead>
<tbody>
<tr><td>Цель</td><td>Регулярный мониторинг масла и машины</td><td>Расследование конкретной проблемы</td></tr>
<tr><td>Объём пробы</td><td>&lt; 250 мл</td><td>1 л и более</td></tr>
<tr><td>Тесты</td><td>Вязкость, вода, TBN, вспышка, элементы (ICP), FTIR: окисление, нитрация, сульфатация, гликоль, топливо</td><td>Отложения, частицы износа (феррография, SEM-EDS), пробы топлива, специальные тесты масла</td></tr>
<tr><td>Срок</td><td>Обычно 24 ч с момента получения</td><td>Дольше, выбирается под задачу</td></tr>
<tr><td>Стоимость</td><td>Низкая, автоматизированное оборудование</td><td>Выше; нужна подробная история машины</td></tr>
</tbody></table></div></div>
<div class="section"><h2>Два уровня тревоги</h2>
<div class="charts">
<div class="callout warn"><b class="t">Warning / Caution / Attention</b><p>Потенциальная проблема. Требуется расследование силами механиков, часто — повторная проба с укороченным интервалом.</p></div>
<div class="callout crit"><b class="t">Action / Critical</b><p>Серьёзная конкретная проблема. Требуются действия: осмотр, ремонт, замена масла, остановка машины.</p></div>
</div>
<div class="prose"><p>Исходные лимиты задают OEM или поставщик масла. Если они расходятся, в гарантийный период приоритет у OEM. Лимиты — это ориентир: эксперт может отступить от них с учётом тренда и информации от персонала. Их нужно пересматривать для каждой системы по мере накопления данных — слепая опора на произвольные лимиты создаёт ложное чувство безопасности.</p></div>
</div>
<div class="section"><h2>Что нужно знать для интерпретации</h2>
<div class="prose"><ul>
<li>Точные сведения об оборудовании: тип, OEM, модель двигателя, узел</li>
<li>Условия эксплуатации: пыль, температура окружающей среды, высота</li>
<li>Режим работы: пиковые температуры масла, частота пусков/остановок, холостой ход, нагрузка</li>
<li>Наработка машины и масла, объём доливок</li>
<li>Историю: ремонты, инциденты, замены фильтров и масла</li>
</ul>
<div class="callout info"><b class="t">Главное правило</b><p>Полноценный диагноз невозможно поставить по одной пробе. Работает только тренд одной и той же точки отбора, одной лаборатории и одного метода.</p></div>
</div></div>
<div class="section"><h2>Как изучать этот атлас</h2>
<div class="steps">
<div class="step"><h3>Отбор проб</h3><p>Плохая проба = неправильный вывод. <a href="#/sampling">Процедура →</a></p></div>
<div class="step"><h3>Методы испытаний</h3><p>Что измеряет каждый тест и где его слепые зоны. <a href="#/methods">Методы →</a></p></div>
<div class="step"><h3>Элементы и параметры</h3><p>Откуда берётся каждый элемент в каждой системе. <a href="#/elements">Элементы →</a> · <a href="#/params">Параметры →</a></p></div>
<div class="step"><h3>Комбинации</h3><p>Элементы читаются группами — так находят источник. <a href="#/patterns">Комбинации →</a></p></div>
<div class="step"><h3>Тренды и лимиты</h3><p>Скорость роста важнее абсолютной цифры. <a href="#/trends">Тренды →</a> · <a href="#/limits">Лимиты →</a></p></div>
<div class="step"><h3>Кейсы</h3><p>Разберите учебные примеры, затем проверьте себя в калькуляторе. <a href="#/cases">Кейсы →</a></p></div>
</div></div>`,
en:`
<div class="tiles">
 <div class="tile"><span class="eyebrow">1 · Machine</span><h3>Wear</h3><p>Wear metals (Fe, Cu, Pb, Cr, Al, Sn…), PQ index, ferrography. Wear rises long before noise, vibration and heat.</p></div>
 <div class="tile"><span class="eyebrow">2 · Oil</span><h3>Oil condition</h3><p>Viscosity, TBN, TAN, oxidation, nitration, sulphation, additive elements. Is the oil fit for further use?</p></div>
 <div class="tile"><span class="eyebrow">3 · Contamination</span><h3>What got inside</h3><p>Dust (Si, Al), water, glycol (Na, K, B), fuel, soot, particles per ISO 4406.</p></div>
</div>
<div class="section"><h2>Why do it</h2>
<div class="prose"><ul>
<li><b>Oil condition</b> — is the oil fit for further service.</li>
<li><b>Drain interval optimisation.</b> An effective drain interval can only be set by oil analysis. It depends on engine design, oil quality, oil consumption, operating conditions and fuel.</li>
<li><b>Equipment condition</b> — early signs of faults that will affect reliability.</li>
<li><b>Predictive maintenance.</b> Wear metals and particles rise well before vibration, temperature or noise — oil analysis is still the best early-warning tool for wear.</li>
</ul></div></div>
<div class="section"><h2>Routine vs non-routine analysis</h2>
<div class="tbl-wrap"><table>
<thead><tr><th></th><th>Routine</th><th>Non-routine</th></tr></thead>
<tbody>
<tr><td>Purpose</td><td>Regular monitoring of oil and machine</td><td>Investigating a specific problem</td></tr>
<tr><td>Sample volume</td><td>&lt; 250 ml</td><td>1 l or more</td></tr>
<tr><td>Tests</td><td>Viscosity, water, TBN, flash point, elements (ICP), FTIR: oxidation, nitration, sulphation, glycol, fuel</td><td>Deposits, wear debris (ferrography, SEM-EDS), fuel samples, special oil tests</td></tr>
<tr><td>Turnaround</td><td>Typically 24 h from receipt</td><td>Longer, chosen case by case</td></tr>
<tr><td>Cost</td><td>Low, automated instruments</td><td>Higher; needs detailed machine history</td></tr>
</tbody></table></div></div>
<div class="section"><h2>Two alarm levels</h2>
<div class="charts">
<div class="callout warn"><b class="t">Warning / Caution / Attention</b><p>A potential problem. Needs investigation by maintenance staff, often a resample at a shorter interval.</p></div>
<div class="callout crit"><b class="t">Action / Critical</b><p>A serious specific problem. Needs action: inspection, repair, oil change, machine stop.</p></div>
</div>
<div class="prose"><p>Initial limits come from the OEM or the oil supplier. When they differ, OEM limits take priority during warranty. Limits are guidance: an expert may overrule them based on the trend and staff input. They must be reviewed per system as data builds up — relying on arbitrary limits gives a false sense of security.</p></div>
</div>
<div class="section"><h2>What you need to interpret</h2>
<div class="prose"><ul>
<li>Exact equipment data: type, OEM, engine model, component</li>
<li>Operating environment: dust, ambient temperature, altitude</li>
<li>Duty: peak oil temperatures, start/stop frequency, idling, load</li>
<li>Machine and oil hours, top-up volumes</li>
<li>History: repairs, incidents, filter and oil changes</li>
</ul>
<div class="callout info"><b class="t">Rule number one</b><p>A proper diagnosis cannot be made from a single sample. Only a trend from the same sampling point, same lab and same method works.</p></div>
</div></div>
<div class="section"><h2>How to study this atlas</h2>
<div class="steps">
<div class="step"><h3>Sampling</h3><p>A bad sample means a wrong conclusion. <a href="#/sampling">Procedure →</a></p></div>
<div class="step"><h3>Test methods</h3><p>What each test measures and its blind spots. <a href="#/methods">Methods →</a></p></div>
<div class="step"><h3>Elements and parameters</h3><p>Where each element comes from in each system. <a href="#/elements">Elements →</a> · <a href="#/params">Parameters →</a></p></div>
<div class="step"><h3>Combinations</h3><p>Elements are read in groups — that is how you find the source. <a href="#/patterns">Combinations →</a></p></div>
<div class="step"><h3>Trends and limits</h3><p>Rate of change matters more than the absolute number. <a href="#/trends">Trends →</a> · <a href="#/limits">Limits →</a></p></div>
<div class="step"><h3>Cases</h3><p>Work through training examples, then test yourself in the checker. <a href="#/cases">Cases →</a></p></div>
</div></div>`}
};

PAGES.sampling={
 title:T('Отбор проб','Sampling'),
 lead:T('Проба должна представлять весь объём масла в узле. Большинство «странных» результатов — это ошибка отбора, а не неисправность.',
        'The sample must represent the whole oil volume in the component. Most "odd" results are sampling errors, not faults.'),
 html:{
ru:`
<div class="charts">
<div class="callout ok"><b class="t">Делать</b><ul>
<li>Отбирать на работающей машине при рабочей температуре или сразу после остановки, пока масло тёплое</li>
<li>Всегда из одной и той же точки для данного узла</li>
<li>Использовать только чистый и сухой инструмент для отработанного масла</li>
<li>Протереть точку отбора безворсовой салфеткой</li>
<li>Слить несколько десятков мл в запасную ёмкость перед отбором (промывка)</li>
<li>Если сомневаетесь в чистоте бутылки — ополоснуть её тем же маслом</li>
<li>Заполнять бутылку на 90 % и плотно закрывать</li>
<li>Быстро отправлять в лабораторию</li>
</ul></div>
<div class="callout crit"><b class="t">Не делать</b><ul>
<li>Не отбирать на холодной или долго стоявшей машине — частицы и вода осели</li>
<li>Не отбирать сразу после значительной доливки свежего масла</li>
<li>Не отбирать из сливной пробки в начале слива и со дна бака</li>
<li>Не использовать бутылки из-под других жидкостей</li>
<li>Не менять точку отбора от пробы к пробе</li>
</ul></div>
</div>
<div class="section"><h2>Этикетка пробы</h2>
<div class="prose"><p>Пропуски и ошибки на этикетке задерживают анализ и делают корректную рекомендацию невозможной. Лучше использовать заранее подписанные бутылки, но проверять, что бутылка соответствует точке отбора.</p></div>
<div class="tbl-wrap"><table><thead><tr><th>Поле</th><th>Зачем</th></tr></thead><tbody>
<tr><td>Тип техники (экскаватор, самосвал…)</td><td>Выбор набора лимитов</td></tr>
<tr><td>OEM и модель двигателя / узла</td><td>Металлургия и лимиты производителя (для самосвалов обязательно)</td></tr>
<tr><td>Серийный / гаражный номер</td><td>Построение тренда</td></tr>
<tr><td>Узел и точка отбора</td><td>Двигатель, ГМП, гидравлика, бортовой L/R…</td></tr>
<tr><td>Масло (бренд, класс вязкости)</td><td>Сравнение со свежим, контроль смешения</td></tr>
<tr><td>Наработка машины, моточасы</td><td>Приработка, общий износ</td></tr>
<tr><td>Наработка масла</td><td>Нормирование по часам (ppm/100 ч)</td></tr>
<tr><td>Доливка с последней замены, л</td><td>Разбавление металлов свежим маслом</td></tr>
<tr><td>Дата отбора, ФИО</td><td>Прослеживаемость</td></tr>
</tbody></table></div></div>
<div class="section"><h2>Точки отбора</h2>
<div class="tbl-wrap"><table><thead><tr><th>Способ</th><th>Представительность</th><th>Комментарий</th></tr></thead><tbody>
<tr><td>Клапан отбора на линии под давлением (до фильтра)</td><td><span class="sev ok">лучшая</span></td><td>«Живая» зона, стабильные результаты; стандарт для гидравлики и ГМП</td></tr>
<tr><td>Вакуумный насос через щуп / трубку</td><td><span class="sev warn">средняя</span></td><td>Трубка каждый раз новая, одинаковой длины, не касаться дна</td></tr>
<tr><td>Из сливной пробки</td><td><span class="sev crit">плохая</span></td><td>Первые порции содержат осадок и воду; только середина потока</td></tr>
</tbody></table></div></div>
<div class="section"><h2>Периодичность</h2>
<div class="prose"><p>Стандартные лимиты в материалах EM рассчитаны на интервал <b>250 ч для двигателей</b> и <b>500 ч для остальных систем</b>. При удлинённом интервале (двигатель 500 ч, узлы 1000 ч) лимиты нужно увеличивать — но не пропорционально: разные элементы накапливаются по-разному.</p>
<p>После капремонта или крупного ремонта — контрольная проба через <b>10 моточасов</b>. Она подтверждает успешность ремонта и отсутствие топлива/воды.</p>
<p>Если результат неясен или данных мало — сократите интервал между пробами.</p></div></div>`,
en:`
<div class="charts">
<div class="callout ok"><b class="t">Do</b><ul>
<li>Sample a running machine at operating temperature, or right after shutdown while the oil is warm</li>
<li>Always use the same sampling point for a given component</li>
<li>Use only clean, dry tools dedicated to used oil</li>
<li>Wipe the sampling point with a lint-free cloth</li>
<li>Flush a few tens of ml into a spare bottle before taking the sample</li>
<li>If unsure of bottle cleanliness, rinse it with the same oil</li>
<li>Fill the bottle to 90 % and seal it tightly</li>
<li>Ship to the lab promptly</li>
</ul></div>
<div class="callout crit"><b class="t">Don't</b><ul>
<li>Don't sample a cold or long-idle machine — particles and water have settled</li>
<li>Don't sample right after a significant fresh oil top-up</li>
<li>Don't sample the first drain flow or from the tank bottom</li>
<li>Don't reuse bottles from other fluids</li>
<li>Don't change the sampling point between samples</li>
</ul></div>
</div>
<div class="section"><h2>Sample label</h2>
<div class="prose"><p>Missing or wrong label data delays analysis and makes a proper recommendation impossible. Pre-labelled bottles help, but check the bottle matches the sampling point.</p></div>
<div class="tbl-wrap"><table><thead><tr><th>Field</th><th>Why</th></tr></thead><tbody>
<tr><td>Equipment type (excavator, dump truck…)</td><td>Selects the limit set</td></tr>
<tr><td>OEM and engine / component model</td><td>Metallurgy and OEM limits (a must for dump trucks)</td></tr>
<tr><td>Serial / fleet number</td><td>Builds the trend</td></tr>
<tr><td>Component and sampling point</td><td>Engine, transmission, hydraulics, final drive L/R…</td></tr>
<tr><td>Oil (brand, viscosity grade)</td><td>Fresh oil comparison, mixing check</td></tr>
<tr><td>Machine hours</td><td>Running-in, overall wear</td></tr>
<tr><td>Oil hours</td><td>Normalisation per hour (ppm/100 h)</td></tr>
<tr><td>Top-up since last change, l</td><td>Dilution of metals by fresh oil</td></tr>
<tr><td>Sampling date, operator</td><td>Traceability</td></tr>
</tbody></table></div></div>
<div class="section"><h2>Sampling points</h2>
<div class="tbl-wrap"><table><thead><tr><th>Method</th><th>Representativeness</th><th>Comment</th></tr></thead><tbody>
<tr><td>Sampling valve on a pressurised line (before filter)</td><td><span class="sev ok">best</span></td><td>Live zone, stable results; standard for hydraulics and transmissions</td></tr>
<tr><td>Vacuum pump via dipstick tube</td><td><span class="sev warn">fair</span></td><td>New tube every time, same length, never touch the bottom</td></tr>
<tr><td>Drain plug</td><td><span class="sev crit">poor</span></td><td>First flow carries sediment and water; mid-stream only</td></tr>
</tbody></table></div></div>
<div class="section"><h2>Frequency</h2>
<div class="prose"><p>Standard limits in EM materials assume <b>250 h for engines</b> and <b>500 h for other systems</b>. With extended intervals (engine 500 h, components 1000 h) limits should be raised — but not proportionally: elements accumulate differently.</p>
<p>After an overhaul or major repair take a check sample at <b>10 operating hours</b>. It confirms the repair and the absence of fuel/water.</p>
<p>If a result is unclear or data is lacking, shorten the sampling interval.</p></div></div>`}
};

PAGES.methods={
 title:T('Методы испытаний','Test methods'),
 lead:T('Что измеряет каждый тест, в каких единицах и где его слепые зоны. Сравнивать можно только результаты одной лаборатории одним и тем же методом.',
        'What each test measures, in which units, and where its blind spots are. Only compare results from the same lab using the same method.'),
 rows:[
  {n:T('Элементный анализ ICP-OES','Elemental analysis ICP-OES'),std:'ASTM D5185',tag:T('рутинный','routine'),
   d:T('Проба смешивается с растворителем и распыляется в аргоновую плазму (~10 000 °C). Каждый элемент излучает свет своей длины волны; интенсивность пропорциональна концентрации. Лаборатории обычно измеряют 20–30 элементов: износ, присадки, загрязнения.<br><b>Слепая зона:</b> частицы крупнее ~5–10 мкм не испаряются полностью — ICP занижает серьёзный износ с крупными частицами. Не видит углерод и органику. Не отличает сталь корпуса от стали подшипника, а железорудную пыль — от износа.',
     'The sample is diluted and sprayed into argon plasma (~10,000 °C). Each element emits light at its own wavelength; intensity is proportional to concentration. Labs typically report 20–30 elements: wear, additives, contaminants.<br><b>Blind spot:</b> particles larger than ~5–10 µm do not fully vaporise — ICP under-reports severe wear with large debris. Blind to carbon and organics. Cannot tell housing steel from bearing steel, or iron-ore dust from wear.')},
  {n:T('Кинематическая вязкость','Kinematic viscosity'),std:'ASTM D445 / D7279 · D2270 (VI)',tag:T('рутинный','routine'),
   d:T('Время истечения через капилляр при 40 °C и/или 100 °C, мм²/с (cSt). Кинематическая вязкость = динамическая / плотность.','Flow time through a capillary at 40 °C and/or 100 °C, mm²/s (cSt). Kinematic viscosity = dynamic viscosity / density.')},
  {n:T('Щелочное число TBN','Base number TBN'),std:'ASTM D2896 · ASTM D4739',tag:T('рутинный','routine'),
   d:T('Титрование кислотой; результат в мг KOH/г. D2896 (хлорная кислота) — для свежих масел, даёт более высокие значения; D4739 (соляная) — чаще для отработанных. Не смешивайте методы в одном тренде.','Acid titration; result in mg KOH/g. D2896 (perchloric acid) is for fresh oils and reads higher; D4739 (hydrochloric) is common for used oils. Never mix methods in one trend.')},
  {n:T('Кислотное число TAN','Acid number TAN'),std:'ASTM D664',tag:T('рутинный','routine'),
   d:T('Потенциометрическое титрование щёлочью, мг KOH/г. Главный индикатор старения для гидравлики, редукторов, турбин.','Potentiometric titration with base, mg KOH/g. The main ageing indicator for hydraulics, gearboxes, turbines.')},
  {n:T('ИК-спектроскопия FTIR','Infrared spectroscopy FTIR'),std:'ASTM E2412',tag:T('рутинный','routine'),
   d:T('Поглощение ИК-излучения на характерных частотах: окисление ~1710 см⁻¹, нитрация ~1630 см⁻¹, сульфатация ~1150 см⁻¹, сажа (базовая линия ~2000 см⁻¹), гликоль (~880, 1040, 1080 см⁻¹), вода (~3400 см⁻¹), топливо, антиизносная присадка ZDDP (~980 см⁻¹). Для интерпретации нужен спектр свежего масла той же партии.','IR absorbance at characteristic frequencies: oxidation ~1710 cm⁻¹, nitration ~1630 cm⁻¹, sulphation ~1150 cm⁻¹, soot (baseline ~2000 cm⁻¹), glycol (~880, 1040, 1080 cm⁻¹), water (~3400 cm⁻¹), fuel, ZDDP anti-wear (~980 cm⁻¹). Needs a fresh oil spectrum of the same batch.')},
  {n:T('Вода по Карлу Фишеру','Karl Fischer water'),std:'ASTM D6304',tag:T('рутинный','routine'),
   d:T('Кулонометрическое титрование, ppm. Самый точный метод для малых концентраций. Crackle-тест (капля на горячей плите) — быстрый качественный скрининг от ~500–1000 ppm.','Coulometric titration, ppm. The most accurate method at low levels. The crackle test (drop on a hot plate) is a quick qualitative screen from ~500–1000 ppm.')},
  {n:T('Температура вспышки','Flash point'),std:'ASTM D93 (PMCC) · D92 (COC)',tag:T('рутинный','routine'),
   d:T('Косвенный признак топлива в масле.','An indirect sign of fuel in oil.')},
  {n:T('Топливо газовой хроматографией','Fuel by gas chromatography'),std:'ASTM D3524 · D7593',tag:T('расширенный','extended'),
   d:T('Точное определение % дизельного топлива. Предпочтительнее FTIR при спорных случаях.','Accurate % diesel fuel. Preferred over FTIR in borderline cases.')},
  {n:T('Гликоль','Glycol'),std:'ASTM D2982 · D4291',tag:T('расширенный','extended'),
   d:T('Качественный (D2982) или количественный ГХ (D4291) тест на этилен-/пропиленгликоль.','Qualitative (D2982) or quantitative GC (D4291) test for ethylene/propylene glycol.')},
  {n:T('Сажа TGA','Soot by TGA'),std:'ASTM D5967 (прил.)',tag:T('расширенный','extended'),
   d:T('Термогравиметрия — прямое измерение % сажи. Лимиты OEM обычно привязаны к TGA.','Thermogravimetry — direct % soot. OEM limits are usually TGA-based.')},
  {n:T('Подсчёт частиц','Particle count'),std:'ISO 4406 · ISO 11500 · ISO 4407',tag:T('рутинный для гидравлики','routine for hydraulics'),
   d:T('Автоматический оптический счётчик (лазер) или микроскоп. Результат — код R4/R6/R14. Вода и сажа завышают счёт.','Automatic optical (laser) counter or microscope. Result is an R4/R6/R14 code. Water and soot inflate counts.')},
  {n:T('PQ-индекс','PQ index'),std:'Magnetometry',tag:T('рутинный для узлов','routine for components'),
   d:T('Суммарная масса ферромагнитного дебриса независимо от размера. Дополняет ICP.','Total ferromagnetic debris mass regardless of size. Complements ICP.')},
  {n:T('Аналитическая феррография','Analytical ferrography'),std:'ASTM D7690',tag:T('расширенный','extended'),
   d:T('Проба проходит через магнитное поле; частицы выстраиваются по размеру на стекле (феррограмма). Эксперт определяет тип, размер и форму частиц и механизм износа: резание, усталость, адгезия, фреттинг, коррозия. Требует опытного специалиста, знающего технику; трендирование затруднено из-за требований к повторяемости отбора.','The sample passes a magnetic field; particles line up by size on a slide (ferrogram). An expert identifies particle type, size, shape and wear mode: cutting, fatigue, adhesion, fretting, corrosion. Needs an expert familiar with the equipment; trending is hard because sampling must be highly repeatable.')},
  {n:T('SEM-EDS анализ дебриса','SEM-EDS wear debris'),std:'—',tag:T('расширенный','extended'),
   d:T('Растровый электронный микроскоп + энергодисперсионная рентгеновская спектроскопия. Определяет размер, форму и состав сотен частиц в пробе (масс. % и ат. %). Разделяет износ, загрязнение и присадки, позволяет установить конкретный сплав — значит, и деталь.','Scanning electron microscope + energy-dispersive X-ray spectroscopy. Measures size, shape and composition of hundreds of particles per sample (mass % and atomic %). Separates wear, contamination and additives, and identifies the specific alloy — hence the part.')},
  {n:T('Прочие тесты','Other tests'),std:'D2272 RPVOT · D7843 MPC · D1401 · D892 · D893',tag:T('по задаче','as needed'),
   d:T('RPVOT — остаточный антиокислительный ресурс (турбины); MPC — склонность к лакам; D1401 — деэмульгируемость; D892 — пенообразование; D893 — нерастворимые в пентане.','RPVOT — remaining oxidation life (turbines); MPC — varnish potential; D1401 — demulsibility; D892 — foaming; D893 — pentane insolubles.')}
 ]

 lead:T('Одна проба — это точка. Решение принимается по линии: как меняется значение, с какой скоростью, и что происходило с машиной между пробами.',

 rules:{
  ru:['Результаты не оцениваются по отдельности. Сравнивайте текущее значение и тренд с лимитом.','Если линия тренда отличается от прошлых — это признак проблемы, даже если лимит не превышен.','Оценка строится на сочетании высоких концентраций и <b>скорости роста</b>.','Резкий рост металла не всегда означает отказ: проверьте изменение нагрузки, недавний ремонт, приработку новой машины.','Короче интервал замены — ниже металлы; длиннее — выше. Нормируйте на наработку масла.','После замены в узле остаётся 10–15 % старого масла — металлы не будут нулевыми.','Большая доливка разбавляет металлы. Низкая концентрация после доливки ещё не значит, что машина исправна.','Сравнивайте результаты только одной лаборатории и одного метода.','Прежде чем назначать крупный ремонт, подтвердите вывод другими методами диагностики.'],
  en:['Results are not judged in isolation. Compare the current value and the trend against the limit.','If the trend line differs from past ones, that signals trouble even below the limit.','Evaluation combines high concentrations with the <b>rate of increase</b>.','A sudden rise in a metal does not always mean failure: check for load changes, recent repair, running-in of a new machine.','Shorter drain — lower metals; longer drain — higher. Normalise to oil hours.','An oil change leaves 10–15 % old oil — metals will not be zero.','A large top-up dilutes metals. A low reading after top-up does not prove the machine is healthy.','Only compare results from one lab and one method.','Before calling for major repair, confirm the conclusion with other diagnostic techniques.']

/* ----- chart ----- */
function lineChart(c){
 const W=560,H=260,m={l:44,r:62,t:14,b:36};
 const iw=W-m.l-m.r, ih=H-m.t-m.b;
 const xs=c.x, xmin=Math.min(...xs), xmax=Math.max(...xs);
 const allv=c.series.flatMap(s=>s.v).concat([c.warn,c.act].filter(v=>v!=null));
 let ymax=Math.max(...allv)*1.08, ymin=c.low?Math.min(...allv)*0.95:0;
 const step=niceStep((ymax-ymin)/5); ymax=Math.ceil(ymax/step)*step; ymin=Math.floor(ymin/step)*step;
 const X=v=>m.l+(xmax===xmin?iw/2:(v-xmin)/(xmax-xmin)*iw), Y=v=>m.t+ih-(v-ymin)/(ymax-ymin)*ih;
 let g='';
 for(let v=ymin; v<=ymax+1e-9; v+=step){g+=`<line class="grid" x1="${m.l}" x2="${m.l+iw}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${+v.toFixed(2)}</text>`;}
 xs.forEach(v=>{g+=`<text x="${X(v)}" y="${H-m.b+16}" text-anchor="middle">${v}</text>`;});
 g+=`<text x="${m.l+iw/2}" y="${H-4}" text-anchor="middle">${tr(c.xl)}</text>`;
 (c.changes||[]).forEach(v=>{const j=xs.indexOf(v); const px=j>=0&&j<xs.length-1?(X(xs[j])+X(xs[j+1]))/2:X(v); g+=`<line class="chg" x1="${px}" x2="${px}" y1="${m.t}" y2="${m.t+ih}"/>`;});
 const ll=c.limLabel?` ${c.limLabel}`:'';
 const labs=[];
 if(c.warn!=null){ g+=`<line class="lim-w" x1="${m.l}" x2="${m.l+iw}" y1="${Y(c.warn)}" y2="${Y(c.warn)}"/>`; labs.push({y:Y(c.warn),t:'W'+ll,cls:'lw'}); }
 if(c.act!=null){ g+=`<line class="lim-c" x1="${m.l}" x2="${m.l+iw}" y1="${Y(c.act)}" y2="${Y(c.act)}"/>`; labs.push({y:Y(c.act),t:'A'+ll,cls:'lc'}); }
 c.series.forEach((s,i)=>{
  const cls='s'+(i+1);
  g+=`<polyline class="ser ${cls}" points="${s.v.map((v,j)=>X(xs[j])+','+Y(v)).join(' ')}"/>`;
  s.v.forEach((v,j)=>{g+=`<circle class="dot ${cls}" cx="${X(xs[j])}" cy="${Y(v)}" r="4.5"/>`;});
  if(c.series.length>1) labs.push({y:Y(s.v[s.v.length-1]),t:s.k,cls:'lbl'});
 });
 labs.sort((a,b)=>a.y-b.y);
 for(let i=1;i<labs.length;i++){ if(labs[i].y-labs[i-1].y<13) labs[i].y=labs[i-1].y+13; }
 const over=labs.length?labs[labs.length-1].y-(m.t+ih):0; if(over>0) labs.forEach(l=>l.y-=over);
 labs.forEach(l=>{g+=`<text class="${l.cls}" x="${m.l+iw+10}" y="${l.y+4}" ${l.cls==='lbl'?'style="fill:var(--ink-2)"':''}>${l.t}</text>`;});
 const hits=xs.map((v,j)=>`<rect x="${X(v)-14}" y="${m.t}" width="28" height="${ih}" fill="transparent" data-j="${j}"/>`).join('');
 return `<div class="chart" data-chart="${c.id}"><h4>${tr(c.title)}</h4><div class="sub">${tr(c.sub)}</div>
 <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr(c.title))}">${g}${hits}</svg>
 ${c.series.length>1?`<div class="legend">${c.series.map((s,i)=>`<span><i style="background:var(--${['wear','cont','add'][i]})"></i>${s.k}</span>`).join('')}</div>`:''}
 <div style="margin-top:8px;display:flex;gap:8px;align-items:flex-start;font-size:13.5px">${sev(c.verdict.sev)}<span>${tr(c.verdict.t)}</span></div></div>`;
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const n=r/p;return (n<1.5?1:n<3?2:n<7?5:10)*p;}
function bindCharts(root){
 root.querySelectorAll('.chart').forEach(ch=>{
  const id=ch.dataset.chart; const c=PAGES.trends.charts.find(x=>x.id===id); if(!c)return;
  const svg=ch.querySelector('svg'); let tip=null;
  svg.querySelectorAll('rect[data-j]').forEach(r=>{
   const show=()=>{const j=+r.dataset.j; if(!tip){tip=document.createElement('div');tip.className='tip';ch.appendChild(tip);}
    tip.innerHTML=`${c.x[j]}<br>`+c.series.map(s=>`${s.k}: ${s.v[j]} ${c.unit}`).join('<br>');
    const box=svg.getBoundingClientRect(), cb=ch.getBoundingClientRect(), rb=r.getBoundingClientRect();
    tip.style.left=(rb.left-cb.left+rb.width/2)+'px'; tip.style.top=(box.top-cb.top+30)+'px'; tip.hidden=false;};
   r.addEventListener('mouseenter',show); r.addEventListener('focus',show);
   r.addEventListener('mouseleave',()=>{if(tip)tip.hidden=true;});
  });
 });
}
